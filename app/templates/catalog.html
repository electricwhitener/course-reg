{% extends "base.html" %}
{% block title %}Catalog · Course Registration{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-baseline mb-3">
  <h1 class="h3 mb-0">Course catalog</h1>
  <span class="text-body-secondary small">Seats refresh every 2 s</span>
</div>
<div class="row g-3" id="sections"></div>
{% endblock %}

{% block scripts %}
<script>
  function seatColor(pct) {
    return pct >= 100 ? "bg-danger" : pct >= 67 ? "bg-warning" : "bg-success";
  }

  function sectionCard(s) {
    const pct = Math.min(s.fill_pct, 100);
    const seatsText = s.seats_left < 0
      ? `<span class="text-danger fw-semibold">OVERBOOKED ${s.enrolled}/${s.capacity}</span>`
      : `${s.enrolled}/${s.capacity} enrolled · ${s.seats_left} left`;
    return `
      <div class="col-sm-6 col-lg-4">
        <div class="card h-100 shadow-sm">
          <div class="card-body d-flex flex-column">
            <div class="d-flex justify-content-between">
              <h2 class="h6 mb-1">${s.course_code}-${s.section_code}</h2>
              <span class="badge text-bg-light">${s.credits} cr</span>
            </div>
            <div class="mb-1">${s.course_title}</div>
            <div class="text-body-secondary small mb-3">${s.instructor_name} · ${s.room}</div>
            <div class="progress mb-1" role="progressbar" aria-label="Seats filled" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100">
              <div class="progress-bar ${seatColor(s.fill_pct)}" style="width: ${pct}%"></div>
            </div>
            <div class="small mb-3">${seatsText}${s.waitlist_len ? ` · ${s.waitlist_len} waiting` : ""}</div>
            <button class="btn btn-primary btn-sm mt-auto" data-section="${s.section_id}">Register</button>
          </div>
        </div>
      </div>`;
  }

  async function loadSections() {
    const sections = await api("/api/sections");
    document.getElementById("sections").innerHTML = sections.map(sectionCard).join("");
  }

  document.getElementById("sections").addEventListener("click", async (e) => {
    const button = e.target.closest("button[data-section]");
    if (!button) return;
    try {
      const result = await api("/api/register", {
        method: "POST",
        body: { student_id: currentStudent(), section_id: Number(button.dataset.section) },
      });
      const kind = { ENROLLED: "success", WAITLISTED: "warning", REJECTED: "danger" }[result.status];
      toast(result.msg, kind);
    } catch (err) {
      toast(err.message, "danger");
    }
    loadSections();
  });

  loadSections();
  setInterval(loadSections, 2000);
</script>
{% endblock %}
